<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John's Assistant</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Good Morning, John</h1>
        <p>Welcome to your personal assistant.</p>
    </header>

    <section class="briefing">

        <div class="card">
            <h2>💊 Morning Medications</h2>
            <p>Status: <strong>Not Logged</strong></p>
        </div>

        <div class="card">
            <h2>❤️ Blood Pressure</h2>
            <p>Last Reading: -- / --</p>
        </div>

        <div class="card">
            <h2>⚖️ Weight</h2>
            <p>Last Weight: --</p>
        </div>

        <div class="card">
            <h2>😴 CPAP</h2>
            <p>No data recorded.</p>
        </div>

        <div class="card">
            <h2>🌤 Weather</h2>
            <p>Coming Soon</p>
        </div>

        <div class="card">
            <h2>📅 Calendar</h2>
            <p>No events today.</p>
        </div>

    </section>

</div>

<script src="script.js"></script>
